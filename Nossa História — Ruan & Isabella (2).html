const LETTER='Minha Isabella,\n\nHoje completamos nosso primeiro ano juntos e fico muito feliz por tudo que vivemos até aqui. Parece que passou rápido, mas, ao mesmo tempo, já temos tantas lembranças, histórias e momentos que fazem parte da nossa vida.\n\nQuero agradecer por estar comigo nos dias bons e também nos mais difíceis, por me apoiar, dividir as preocupações e comemorar comigo cada conquista. Quero que a gente continue realizando nossos sonhos, conhecendo lugares e conquistando muitas coisas lado a lado.\n\nAdmiro muito você, sua inteligência, seu jeito esperto, sua beleza e até esse seu jeitinho estressadinha. E, entre nossas brincadeiras, o senhor e a novinha acabaram construindo uma vida a dois.\n\nPeço a Deus que continue guiando nossos passos, dando sabedoria e paciência para enfrentarmos o que vier. Que nunca faltem respeito, companheirismo e vontade de continuar escolhendo um ao outro. Eu te amo muito, Isabella. Feliz nosso primeiro ano. Que esse seja só o começo de tudo que ainda vamos viver juntos.\n\nDo seu querido senhor.';

const ENT={moon:'moon',sky:'twinkle',final:'chord',counter:'tick',garland:'whoosh'};
function sfx(n){if(!SF.on||!FX[n])return;try{FX[n]()}catch(e){}}
function burst(el){sfx('spark');const r=el.getBoundingClientRect();for(let j=0;j<14;j++){const s=document.createElement('span');s.textContent=['♥','✦','♥','·'][j%4];s.className='bu';s.style.cssText=`left:${r.left+r.width/2}px;top:${r.top+r.height/2}px;--x:${(Math.random()-.5)*280}px;--y:${-60-Math.random()*200}px;color:${j%2?'var(--wi)':'var(--ac)'}`;document.body.append(s);setTimeout(()=>s.remove(),1400)}}
function imgs(c,D){const ps=(c.imgs||[]).map(id=>D.photos.find(p=>p.id==id)).filter(Boolean).slice(0,6);if(!ps.length)return'';const A=[-5,4,-3,6,-4,3];return`<div class="pols${ps.length==1?' one':''}">${ps.map((p,j)=>`<figure style="--a:${A[j]}deg;--d:${.5+j*.25}s"><img src="${p.src}" alt="${E(p.cap)}"><figcaption>${E(p.cap)}</figcaption></figure>`).join('')}</div>`}
const HS=()=>`<div class=hs>${[18,52,84].map((l,j)=>`<span style="left:${l}%;animation-delay:${j*1.7}s;font-size:${12+j*2}px">♥</span>`).join('')}</div>`;
function player(root,D){const L=D.ch.filter(c=>c.on);let i=0,lt=0,dir=1;root.addEventListener('pointermove',e=>{return;lt=Date.now();const s=document.createElement('span');s.textContent='✦';s.className='bu';s.style.cssText=`left:${e.clientX}px;top:${e.clientY}px;--x:${(Math.random()-.5)*40}px;--y:${20+Math.random()*30}px;color:var(--ac);font-size:12px`;document.body.append(s);setTimeout(()=>s.remove(),1400)});
const go=n=>{dir=n>=i?1:-1;sfx('whoosh');const s=root.querySelector('.sl');if(s){s.style.transition='.28s';s.style.opacity=0;s.style.transform='translateY(-12px)'}setTimeout(()=>{i=Math.max(0,Math.min(L.length-1,n));draw()},s?280:0)};
const menu=()=>{if(root.querySelector('.lm'))return;const o=document.createElement('div');o.className='lm';o.setAttribute('role','dialog');o.setAttribute('aria-label','Capítulos');o.innerHTML=`<div class="paper idx"><button class="cx">✕ Fechar</button><h2>Capítulos</h2><ol>${L.map((q,j)=>`<li><button class="g${j==i?' cur':''}" data-j="${j}">${String(j+1).padStart(2,'0')} · ${E(q.title)}</button></li>`).join('')}</ol></div>`;const kd=e=>{if(e.key=='Escape'){e.preventDefault();e.stopPropagation();close()}};const close=()=>{document.removeEventListener('keydown',kd,true);o.remove()};document.addEventListener('keydown',kd,true);o.onclick=e=>{if(e.target==o)close()};o.querySelector('.cx').onclick=close;o.querySelectorAll('li button').forEach(bt=>bt.onclick=()=>{close();go(+bt.dataset.j)});root.querySelector('.pl').append(o);o.querySelector('.cx').focus()};
const kn=e=>{if(!root.isConnected){document.removeEventListener('keydown',kn);return}if(root.querySelector('.lm')||/INPUT|TEXTAREA|SELECT/.test((e.target||{}).tagName||''))return;if(e.key=='ArrowRight')go(i+1);else if(e.key=='ArrowLeft')go(i-1)};document.addEventListener('keydown',kn);
let tx=0,ty=0,tg=null;root.addEventListener('touchstart',e=>{const t=e.touches[0];tx=t.clientX;ty=t.clientY;tg=e.target},{passive:true});root.addEventListener('touchend',e=>{const t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;if(tg&&tg.closest&&tg.closest('.gal,.pc,.fr,input,textarea,.lm,.wh,iframe,.tr'))return;if(Math.abs(dx)>80&&Math.abs(dx)>Math.abs(dy)*1.6){if(dx<0&&L[i].type!='final')go(i+1);else if(dx>0)go(i-1)}},{passive:true});
function draw(){if(MUS.p){try{MUS.p.stopVideo()}catch(e){}MUS.p=null}SF.duck=false;const c=L[i],last=i==L.length-1||c.type=='final';root.innerHTML=`<div class=pl style="height:100%;${tv(c,i)}">${c.bgv?`<video class=bgv src="${E(c.bgv)}" autoplay muted loop playsinline></video><div class=bgs></div>`:''}${c.type=='cover'?'':HS()}<button class=snd id=sn aria-label="Som">${SL()}</button><div class=bar><i style="width:${(i+1)/L.length*100}%"></i></div><button class=hd id=hd aria-label="Ver capítulos"><b>${String(i+1).padStart(2,'0')}</b> / ${L.length} · ${E(c.title)}</button>${(c.type=='cover'||c.type=='final')&&cvr(c,D)?`<div class=bgi style="background-image:url(${cvr(c,D)})"></div>`:''}<div class=grain></div><div class="sl ${dir>0?'fwd':'bk'}">${body(c,D)}${['cover','moon','quiz','gallery','puzzle','garland','booth'].includes(c.type)?'':imgs(c,D)}</div><div class=nv>${i?'<button class=g id=pb>Voltar</button>':'<span></span>'}${last?'':`<button id=nb>${i?'Continuar':E(D.btn)}</button>`}</div></div>`;
const a=root.querySelector('#pb'),b=root.querySelector('#nb');if(a)a.onclick=()=>go(i-1);if(b)b.onclick=()=>go(i+1);const sn=root.querySelector('#sn');sn.onclick=()=>{if(SF.on&&SF.v>.5)SF.v=.3;else if(SF.on)SF.on=false;else{SF.on=true;SF.v=.6}try{localStorage.setItem('nh_snd',!SF.on?'0':SF.v<.5?'L':'1')}catch(e){}sn.textContent=SL();sfx('pop')};root.querySelector('#hd').onclick=menu;SF.duck=false;if(ENT[c.type])setTimeout(()=>sfx(ENT[c.type]),300);root.querySelector('.pl').style.setProperty('--r',(i*28)%90+'deg');root.querySelectorAll('.pols img').forEach(m=>m.onclick=()=>{const o=document.createElement('div');o.className='lb';o.innerHTML=`<img src="${m.src}" alt="">`;o.onclick=()=>o.remove();document.body.append(o)});hook(c,D,root.querySelector('.sl'))}
if(L.length)draw()}
(function(){let d=null;try{d=JSON.parse(document.getElementById('d').textContent)}catch(e){}
if(d)player(document.getElementById('app'),d);else if(window.admin)window.admin()})();
</script></body></html>
